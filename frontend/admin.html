<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Afia's World</title><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/lucide@latest"></script></head><body class="admin-body"><div class="admin-shell"><aside class="admin-side"><a class="logo" href="index.html">Afia's <span>World</span></a><div class="admin-nav"><button class="active" onclick="showPanel('overview',this)">Overview</button><button onclick="showPanel('products',this)">Products</button><button onclick="showPanel('orders',this)">Orders</button><button onclick="adminLogout()">Logout</button></div></aside><main class="admin-main"><div class="admin-top"><div><p class="eyebrow">Store control</p><h1>Dashboard</h1><p id="adminWelcome" class="cart-meta"></p></div><div style="display:flex;gap:10px"><button id="themeToggle" class="icon-btn" aria-label="Toggle Theme" style="background:var(--surface);border:1px solid var(--line)"><i data-lucide="sun"></i></button><a class="btn secondary" href="index.html">View store <i data-lucide="external-link" style="width:14px;height:14px"></i></a></div></div><section id="overview" class="admin-panel-view"><div id="stats" class="stats-grid"></div><div class="admin-panel"><h3>Recent orders</h3><div id="recentOrders"></div></div></section><section id="products" class="admin-panel-view hidden"><div class="admin-top"><h2>Products</h2><button class="btn" onclick="openProductForm()">+ Add product</button></div><div id="productFormWrap" class="admin-panel hidden"><form id="productForm" class="admin-form-grid" onsubmit="saveProduct(event)"><input type="hidden" id="pId"><div class="form-group"><label>NAME</label><input id="pName" required></div><div class="form-group"><label>SLUG</label><input id="pSlug" required></div><div class="form-group"><label>CATEGORY</label><select id="pCategory" required></select></div><div class="form-group"><label>PRICE (৳)</label><input id="pPrice" type="number" min="0" required></div><div class="form-group"><label>STOCK</label><input id="pStock" type="number" min="0" required></div><div class="form-group"><label>IMAGE FILE</label><input id="pImage" type="file" accept="image/*"></div><div class="form-group full"><label>DESCRIPTION</label><textarea id="pDescription" rows="3"></textarea></div><div class="full"><button class="btn" id="saveBtn" type="submit">Save product</button><button class="btn secondary" type="button" onclick="closeProductForm()">Cancel</button></div></form></div><div class="admin-panel"><div id="productsTable"></div></div></section><section id="orders" class="admin-panel-view hidden"><div class="admin-top"><h2>Orders</h2></div><div class="admin-panel"><div id="ordersTable"></div></div></section></main></div><div id="toast" class="toast"></div><script src="js/script.js"></script><script>
let adminToken=localStorage.getItem('afiaToken')||'',allProducts=[];
async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})};if(adminToken)h.Authorization='Bearer '+adminToken;const r=await fetch('/api'+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401||r.status===403){localStorage.removeItem('afiaToken');localStorage.removeItem('afiaUser');location.href='login.html'}throw Error(d.error||'Request failed')}return d}
async function boot(){try{const me=await api('/auth/me');if(me.role!=='admin')throw Error('Admin access required');document.getElementById('adminWelcome').textContent='Signed in as '+me.email;await Promise.all([loadStats(),loadProducts(),loadOrders(),loadCategories()])}catch(e){document.body.innerHTML='<main class="page"><div class="container"><div class="empty">'+esc(e.message)+'<br><br><a class="btn" href="login.html">Go to login</a></div></div></main>'}}
async function loadStats(){const s=await api('/admin/stats');document.getElementById('stats').innerHTML=[['Products',s.products],['Customers',s.users],['Orders',s.orders],['Revenue',money(s.revenue)]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')}
async function loadProducts(){allProducts=await api('/products');document.getElementById('productsTable').innerHTML='<div style="overflow:auto"><table class="data-table"><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>'+allProducts.map(p=>'<tr><td><div class="admin-product-cell">'+(p.image?'<img class="admin-product-thumb" src="'+esc(p.image)+'" alt="" loading="lazy">':'<span class="admin-product-thumb placeholder">✦</span>')+'<span>'+esc(p.name)+'</span></div></td><td>'+esc(p.category)+'</td><td>'+money(p.price)+'</td><td>'+p.stock+'</td><td><button class="btn secondary" onclick="editProduct('+p.id+')">Edit</button> <button class="btn secondary" onclick="deleteProduct('+p.id+')">Delete</button></td></tr>').join('')+'</table></div>'}
async function loadOrders(){const os=await api('/admin/orders');const statuses=['pending','confirmed','processing','shipped','delivered','cancelled'];const rows=os.map(o=>'<tr><td>#'+o.id+'</td><td>'+esc(o.customer_name)+'</td><td>'+esc(o.user_email)+'</td><td>'+money(o.total)+'</td><td><select onchange="setStatus('+o.id+',this.value)">'+statuses.map(s=>'<option value="'+s+'" '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('');document.getElementById('ordersTable').innerHTML='<div style="overflow:auto"><table class="data-table"><tr><th>Order</th><th>Customer</th><th>Email</th><th>Total</th><th>Status</th></tr>'+rows+'</table></div>';document.getElementById('recentOrders').innerHTML=os.slice(0,5).map(o=>'<p style="font-size:12px"><strong>#'+o.id+'</strong> · '+esc(o.customer_name)+' · '+money(o.total)+' · '+esc(o.status)+'</p>').join('')||'<div class="empty">No orders yet.</div>'}
async function loadCategories(){const cs=await api('/categories');document.getElementById('pCategory').innerHTML=cs.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')}
async function setStatus(id,status){try{await api('/admin/orders/'+id+'/status',{method:'PUT',body:JSON.stringify({status})});toast('Order status updated');await Promise.all([loadStats(),loadOrders()])}catch(e){toast(e.message);loadOrders()}}
function showPanel(id,btn){document.querySelectorAll('.admin-panel-view').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.admin-nav button').forEach(x=>x.classList.remove('active'));btn?.classList.add('active')}
function openProductForm(p=null){document.getElementById('productForm').reset();document.getElementById('pId').value=p?.id||'';document.getElementById('pName').value=p?.name||'';document.getElementById('pSlug').value=p?.slug||'';document.getElementById('pCategory').value=p?.category_id||'';document.getElementById('pPrice').value=p?.price??'';document.getElementById('pStock').value=p?.stock??'';document.getElementById('pDescription').value=p?.description||'';document.getElementById('saveBtn').textContent=p?'Update product':'Save product';document.getElementById('productFormWrap').classList.remove('hidden')}
function closeProductForm(){document.getElementById('productFormWrap').classList.add('hidden')}
function editProduct(id){const p=allProducts.find(x=>x.id===id);if(p)openProductForm(p)}
async function saveProduct(e){e.preventDefault();const id=document.getElementById('pId').value;const formData=new FormData();formData.append('name',document.getElementById('pName').value.trim());formData.append('slug',document.getElementById('pSlug').value.trim().toLowerCase());formData.append('category_id',document.getElementById('pCategory').value);formData.append('price',document.getElementById('pPrice').value);formData.append('stock',document.getElementById('pStock').value);formData.append('description',document.getElementById('pDescription').value.trim());formData.append('featured',0);const imgInput=document.getElementById('pImage');if(imgInput.files[0])formData.append('image',imgInput.files[0]);try{const url=id?'/products/'+id:'/products';const method=id?'PUT':'POST';const h={'Authorization':`Bearer ${localStorage.getItem('afiaToken')}`};const r=await fetch('/api'+url,{method,headers:h,body:formData});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');toast(id?'Product updated':'Product created');closeProductForm();await Promise.all([loadProducts(),loadStats()])}catch(err){toast(err.message)}}
async function deleteProduct(id){if(!confirm('Delete this product?'))return;try{await api('/products/'+id,{method:'DELETE'});toast('Product deleted');await loadProducts();await loadStats()}catch(e){toast(e.message)}}
function adminLogout(){localStorage.removeItem('afiaToken');localStorage.removeItem('afiaUser');location.href='login.html'}
boot();
</script></body></html>
